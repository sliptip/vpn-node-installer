name: Apply 0.1.6-dev client input improvements v2

on:
  push:
    paths:
      - ".github/workflows/apply-0.1.6-client-input-fix-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic edits
        run: |
          python3 <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path('clients.sh')
          s = p.read_text()
          s = one(s, 'VERSION="0.1.5-dev"', 'VERSION="0.1.6-dev"', 'client version')
          needle = "        if len(s) > 128:\n"
          insert = "        if not re.search(r'[a-z0-9]', s):\n            rejected.append((original, 'имя должно содержать хотя бы одну латинскую букву или цифру'))\n            continue\n        if len(s) > 128:\n"
          s = one(s, needle, insert, 'alphanumeric guard')

          start = s.index('self_test(){')
          end = s.index('\nif [[ "${1:-}" == "--self-test" ]]', start)
          funcs = r'''collect_input(){
            local output="$1" timeout="${2:-$INPUT_IDLE_TIMEOUT}" ch=""
            : >"$output"
            if ! IFS= read -r -N 1 ch; then
              [[ -n "$ch" ]] || return 1
            fi
            printf '%s' "$ch" >>"$output"
            while true; do
              ch=""
              if IFS= read -r -N 1 -t "$timeout" ch; then
                printf '%s' "$ch" >>"$output"
                continue
              fi
              [[ -n "$ch" ]] && printf '%s' "$ch" >>"$output"
              break
            done
            [[ -s "$output" ]]
          }

          self_test(){
            local d raw out bad expected captured captured_expected rejected_count
            d=$(mktemp -d)
            trap 'rm -rf "$d"' RETURN
            raw="$d/raw"; out="$d/out"; bad="$d/bad"; expected="$d/expected"
            captured="$d/captured"; captured_expected="$d/captured.expected"
            cat >"$raw" <<'EOF_TEST'
          | alice\@legacy.example |
          | --------------------- |
          bob.smith@legacy.example
          mobile-01@other.example
          work.pc@example.test
          plain_name
          alice@another.example
          .
          ..
          _
          +
          -

          EOF_TEST
            cat >"$expected" <<'EOF_TEST'
          alice
          bob.smith
          mobile-01
          work.pc
          plain_name
          EOF_TEST
            normalize_input "$raw" "$out" "$bad"
            diff -u "$expected" "$out"
            rejected_count=$(wc -l <"$bad")
            [[ "$rejected_count" -eq 5 ]]
            grep -Fq 'имя должно содержать хотя бы одну латинскую букву или цифру' "$bad"
            printf 'first@example.test\nlast@example.test' >"$captured_expected"
            collect_input "$captured" 0.1 < <(
              printf 'first@example.test\nlast@example.test'
              sleep 0.3
            )
            cmp -s "$captured_expected" "$captured"
            echo "clients.sh self-test: OK"
          }
          '''.strip()
          s = s[:start] + funcs + s[end:]

          start = s.index("printf '\\nВставьте весь список имён или email одним блоком, по одному на строку.\\n'")
          end_marker = "printf '\\nВвод завершён.\\n'"
          end = s.index(end_marker, start) + len(end_marker)
          input_block = r'''printf '\nВставьте весь список имён или email одним блоком, по одному на строку.\n'
          printf 'Можно вставить обычный столбец или Markdown-таблицу.\n'
          printf 'После начала вставки ввод завершится автоматически после %s сек без новых символов. Enter после последней строки не нужен.\n\n' "$INPUT_IDLE_TIMEOUT"

          collect_input "$raw" || die "Не получено ни одного символа."
          printf '\nВвод завершён.\n'
          '''.strip()
          s = s[:start] + input_block + s[end:]
          p.write_text(s)

          p = Path('install.sh')
          s = p.read_text()
          s = one(s, 'VERSION="0.1.5-dev"', 'VERSION="0.1.6-dev"', 'installer version')
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          s = one(s, 'Текущая версия: **0.1.5-dev**.', 'Текущая версия: **0.1.6-dev**.', 'README version')
          s = one(s, '`0.1.4-dev` — безопасное подтверждение массового добавления клиентов и корректное сохранение версии установщика, а `0.1.5-dev` — резервный known-good источник `sliptip/3x-ui` на случай недоступности официального upstream.', '`0.1.4-dev` — безопасное подтверждение массового добавления клиентов и корректное сохранение версии установщика, `0.1.5-dev` — резервный known-good источник `sliptip/3x-ui` на случай недоступности официального upstream, а `0.1.6-dev` — надёжный idle-ввод без завершающего Enter и защита от имён из одних знаков пунктуации.', 'README history')
          s = s.replace('Пока `0.1.5-dev` не прошла', 'Пока `0.1.6-dev` не прошла', 1)
          old = 'Файл со списком на сервер загружать не нужно. После запуска просто вставьте **весь список одним сплошным блоком** в SSH-терминал. Скрипт получает первую строку без ограничения по времени, затем собирает следующие строки, пока они приходят. После последней строки наступает пауза; через **1,5 секунды без новых строк** ввод считается законченным.\n\nЕсли вставленный текст не содержит завершающего перевода строки и курсор остался на последнем адресе, просто нажмите `Enter` один раз. Никакая специальная точка, пустая строка или `Ctrl+D` не нужны.'
          new = 'Файл со списком на сервер загружать не нужно. После запуска просто вставьте **весь список одним сплошным блоком** в SSH-терминал. Скрипт ждёт начала вставки без ограничения по времени, а после первого полученного символа собирает весь поток, включая незавершённую последнюю строку. Через **1,5 секунды без новых символов** ввод считается законченным.\n\nЗавершающий перевод строки больше не нужен: последняя строка сохраняется даже без `Enter`. Никакая специальная точка, пустая строка или `Ctrl+D` также не нужны.'
          s = one(s, old, new, 'README input')
          s = one(s, 'mobile-01\n[Enter, если курсор остался на последней строке]\n\nВвод завершён.', 'mobile-01\n\nВвод завершён.', 'README example')
          old = 'После нормализации клиент получает имя вида `alice@vpn.orion.example`, то есть исходный почтовый домен не переносится на VPN-узел. Пустые строки и Markdown-разделители игнорируются, `\\@` понимается как обычный `@`, повторы после нормализации удаляются.'
          new = 'После нормализации клиент получает имя вида `alice@vpn.orion.example`, то есть исходный почтовый домен не переносится на VPN-узел. Пустые строки и Markdown-разделители игнорируются, `\\@` понимается как обычный `@`, повторы после нормализации удаляются. Имя обязано содержать хотя бы одну латинскую букву или цифру, поэтому строки вроде `.`, `..`, `_`, `+` или `-` отклоняются до любых изменений на сервере.'
          s = one(s, old, new, 'README punctuation guard')
          p.write_text(s)

          p = Path('SPEC.md')
          s = p.read_text()
          old = 'The operator does not upload a source list file. Input is pasted directly into the SSH terminal as one block. The first line waits normally. After input begins, complete lines are collected until no new complete line arrives for **1.5 seconds**. If the final pasted line has no trailing newline, one `Enter` commits that last line. No `.` sentinel, blank terminator line, or `Ctrl+D` is required.'
          new = 'The operator does not upload a source list file. Input is pasted directly into the SSH terminal as one block. The helper waits indefinitely for the first character; after input begins it collects the character stream until no new character arrives for **1.5 seconds**. A trailing newline is not required, so the final pasted line is preserved without pressing `Enter`. No `.` sentinel, blank terminator line, or `Ctrl+D` is required.'
          s = one(s, old, new, 'SPEC input')
          s = one(s, '- accept only ASCII letters, digits, `.`, `_`, `+`, `-`\n- de-duplicate normalized names while preserving first-seen order', '- accept only ASCII letters, digits, `.`, `_`, `+`, `-`\n- require at least one ASCII letter or digit; punctuation-only names are rejected\n- de-duplicate normalized names while preserving first-seen order', 'SPEC guard')
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          head = '# Changelog\n\n'
          if not s.startswith(head):
              raise SystemExit('CHANGELOG header mismatch')
          entry = '\n'.join([
              '## 0.1.6-dev — 2026-09-16',
              '',
              'Bulk-client input hardening.',
              '',
              '- Reworked pasted input collection to finish on a 1.5-second character-idle gap after the paste starts, so the final line is preserved even without a trailing newline or `Enter`.',
              '- Single-line pastes without a trailing newline are handled by the same collector.',
              '- Client names made only of punctuation such as `.`, `..`, `_`, `+`, or `-` are rejected before preview/mutation; at least one ASCII letter or digit is required.',
              '- Extended `clients.sh --self-test` to cover both the no-final-newline path and punctuation-only rejection.',
              '- `install.sh` and `clients.sh` now report `0.1.6-dev`.',
              '',
          ])
          p.write_text(head + entry + s[len(head):])
          PY

      - name: Syntax and self-test
        run: |
          bash -n install.sh
          bash -n clients.sh
          bash clients.sh --self-test
          grep -Fq 'VERSION="0.1.6-dev"' install.sh
          grep -Fq 'VERSION="0.1.6-dev"' clients.sh
          grep -Fq 'collect_input' clients.sh
          grep -Fq 'read -r -N 1 -t "$timeout"' clients.sh
          grep -Fq "re.search(r'[a-z0-9]', s)" clients.sh

      - name: Commit changes
        run: |
          git config user.name "sliptip"
          git config user.email "70051262+sliptip@users.noreply.github.com"
          git add install.sh clients.sh README.md SPEC.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Improve bulk client input handling"
          git push
