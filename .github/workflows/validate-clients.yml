name: Validate client helper

on:
  push:
    paths:
      - clients.sh
      - .github/workflows/validate-clients.yml
  pull_request:
    paths:
      - clients.sh
      - .github/workflows/validate-clients.yml

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n clients.sh
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=error clients.sh
      - name: Normalization and input self-test
        run: bash clients.sh --self-test
      - name: Input and confirmation invariants
        run: |
          grep -Fq 'VERSION="0.1.6-dev"' clients.sh
          grep -Fq 'INPUT_IDLE_TIMEOUT="1.5"' clients.sh
          grep -Fq 'collect_input(){' clients.sh
          grep -Fq 'read -r -N 1 -t "$timeout" ch' clients.sh
          grep -Fq "re.search(r'[a-z0-9]', s)" clients.sh
          ! grep -Fq 'read -r -t "$INPUT_IDLE_TIMEOUT"' clients.sh
          ! grep -Fq 'После последней строки нажмите Enter' clients.sh
          ! grep -Fq 'введите точку' clients.sh
          grep -Fq 'Добавить ${#new_clients[@]} клиент(ов)? [y/N]:' clients.sh
          grep -Fq '[[ "$answer" =~ ^[Yy]$ ]] ||' clients.sh
          ! grep -Fq '[Y/n]' clients.sh
