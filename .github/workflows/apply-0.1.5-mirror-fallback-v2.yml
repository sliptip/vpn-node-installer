name: Apply 0.1.5-dev mirror fallback v2

on:
  push:
    paths:
      - ".github/workflows/apply-0.1.5-mirror-fallback-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated edit program
        run: |
          awk '
            /^          python3 <<.PY.$/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-0.1.5-mirror-fallback.yml > /tmp/apply015.py
          test -s /tmp/apply015.py
          python3 /tmp/apply015.py

      - name: Validate generated code
        run: |
          bash -n install.sh
          bash -n clients.sh
          grep -Fq 'VERSION="0.1.5-dev"' install.sh
          grep -Fq 'VERSION="0.1.5-dev"' clients.sh
          grep -Fq 'XUI_MIRROR_REPO="sliptip/3x-ui"' install.sh
          grep -Fq 'verify_xui_mirror_known_good' install.sh
          grep -Fq 'install_known_good_with_source_fallback' install.sh

      - name: Commit only product and documentation files
        run: |
          git config user.name "sliptip"
          git config user.email "70051262+sliptip@users.noreply.github.com"
          git add install.sh clients.sh README.md SPEC.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Add known-good 3x-ui mirror fallback"
          git push
