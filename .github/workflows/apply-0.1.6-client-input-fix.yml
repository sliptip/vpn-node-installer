name: Apply 0.1.6-dev client input improvements

on:
  push:
    paths:
      - ".github/workflows/apply-0.1.6-client-input-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic edits
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, got {count}")
              return text.replace(old, new, 1)

          # clients.sh
          p = Path("clients.sh")
          s = p.read_text()
          s = replace_once(s, 'VERSION="0.1.5-dev"', 'VERSION="0.1.6-dev"', 'client version')
          old = '''        if not re.fullmatch(r'[a-z0-9._+-]+', s):
              rejected.append((original, 'разрешены только латиница, цифры, точка, _, + и -'))
              continue
          if len(s) > 128:
          '''
          new = '''        if not re.fullmatch(r'[a-z0-9._+-]+', s):
              rejected.append((original, 'разрешены только латиница, цифры, точка, _, + и -'))
              continue
          if not re.search(r'[a-z0-9]', s):
              rejected.append((original, 'имя должно содержать хотя бы одну латинскую букву или цифру'))
              continue
          if len(s) > 128:
          '''
          s = replace_once(s, old, new, 'alphanumeric client-name guard')

          start = s.index('self_test(){')
          end = s.index('\nif [[ "${1:-}" == "--self-test" ]]', start)
          block = r'''collect_input(){
            local output="$1" timeout="${2:-$INPUT_IDLE_TIMEOUT}" ch=""
            : >"$output"

            # Wait indefinitely for the paste to start. After the first character,
            # finish on an idle gap, not on a terminating newline.
            if ! IFS= read -r -N 1 ch; then
              [[ -n "$ch" ]] || return 1
            fi
            printf '%s' "$ch" >>"$output"

            while true; do
              ch=""
              if IFS= read -r -N 1 -t "$timeout" ch; then
                printf '%s' "$ch" >>"$output"
                continue
              fi
              # Bash keeps characters read before a timeout in the variable.
              [[ -n "$ch" ]] && printf '%s' "$ch" >>"$output"
              break
            done

            [[ -s "$output" ]]
          }

          self_test(){
            local d raw out bad expected captured captured_expected rejected_count
            d=$(mktemp -d)
            trap 'rm -rf "$d"' RETURN
            raw="$d/raw"; out="$d/out"; bad="$d/bad"; expected="$d/expected"
            captured="$d/captured"; captured_expected="$d/captured.expected"
            cat >"$raw" <<'EOF_TEST'
          | alice\@legacy.example |
          | --------------------- |
          bob.smith@legacy.example
          mobile-01@other.example
          work.pc@example.test
          plain_name
          alice@another.example
          .
          ..
          _
          +
          -

          EOF_TEST
            cat >"$expected" <<'EOF_TEST'
          alice
          bob.smith
          mobile-01
          work.pc
          plain_name
          EOF_TEST
            normalize_input "$raw" "$out" "$bad"
            diff -u "$expected" "$out"
            rejected_count=$(wc -l <"$bad")
            [[ "$rejected_count" -eq 5 ]]
            grep -Fq 'имя должно содержать хотя бы одну латинскую букву или цифру' "$bad"

            # Final pasted line intentionally has no trailing newline.
            printf 'first@example.test\nlast@example.test' >"$captured_expected"
            collect_input "$captured" 0.1 < <(
              printf 'first@example.test\nlast@example.test'
              sleep 0.3
            )
            cmp -s "$captured_expected" "$captured"

            echo "clients.sh self-test: OK"
          }
          '''.strip()
          s = s[:start] + block + s[end:]

          old = '''printf '\nВставьте весь список имён или email одним блоком, по одному на строку.\n'
          printf 'Можно вставить обычный столбец или Markdown-таблицу.\n'
          printf 'После последней строки нажмите Enter, если курсор остался на ней. Ввод завершится автоматически после %s сек без новых строк.\n\n' "$INPUT_IDLE_TIMEOUT"

          : >"$raw"
          if ! IFS= read -r line; then
            die "Не получено ни одной строки."
          fi
          printf '%s\n' "$line" >>"$raw"
          while IFS= read -r -t "$INPUT_IDLE_TIMEOUT" line; do
            printf '%s\n' "$line" >>"$raw"
          done
          printf '\nВвод завершён.\n'
          '''
          new = '''printf '\nВставьте весь список имён или email одним блоком, по одному на строку.\n'
          printf 'Можно вставить обычный столбец или Markdown-таблицу.\n'
          printf 'После начала вставки ввод завершится автоматически после %s сек без новых символов. Enter после последней строки не нужен.\n\n' "$INPUT_IDLE_TIMEOUT"

          collect_input "$raw" || die "Не получено ни одного символа."
          printf '\nВвод завершён.\n'
          '''
          s = replace_once(s, old, new, 'interactive input collector')
          p.write_text(s)

          # install.sh version stays aligned with the helper/project version.
          p = Path("install.sh")
          s = p.read_text()
          s = replace_once(s, 'VERSION="0.1.5-dev"', 'VERSION="0.1.6-dev"', 'installer version')
          p.write_text(s)

          # README.md
          p = Path("README.md")
          s = p.read_text()
          s = replace_once(s, 'Текущая версия: **0.1.5-dev**.', 'Текущая версия: **0.1.6-dev**.', 'README version')
          old = '`0.1.4-dev` — безопасное подтверждение массового добавления клиентов и корректное сохранение версии установщика, а `0.1.5-dev` — резервный known-good источник `sliptip/3x-ui` на случай недоступности официального upstream.'
          new = '`0.1.4-dev` — безопасное подтверждение массового добавления клиентов и корректное сохранение версии установщика, `0.1.5-dev` — резервный known-good источник `sliptip/3x-ui` на случай недоступности официального upstream, а `0.1.6-dev` — надёжный idle-ввод без завершающего Enter и защита от имён из одних знаков пунктуации.'
          s = replace_once(s, old, new, 'README history')
          s = s.replace('Пока `0.1.5-dev` не прошла', 'Пока `0.1.6-dev` не прошла', 1)
          old = '''Файл со списком на сервер загружать не нужно. После запуска просто вставьте **весь список одним сплошным блоком** в SSH-терминал. Скрипт получает первую строку без ограничения по времени, затем собирает следующие строки, пока они приходят. После последней строки наступает пауза; через **1,5 секунды без новых строк** ввод считается законченным.

          Если вставленный текст не содержит завершающего перевода строки и курсор остался на последнем адресе, просто нажмите `Enter` один раз. Никакая специальная точка, пустая строка или `Ctrl+D` не нужны.
          '''
          new = '''Файл со списком на сервер загружать не нужно. После запуска просто вставьте **весь список одним сплошным блоком** в SSH-терминал. Скрипт ждёт начала вставки без ограничения по времени, а после первого полученного символа собирает весь поток, включая незавершённую последнюю строку. Через **1,5 секунды без новых символов** ввод считается законченным.

          Завершающий перевод строки больше не нужен: последняя строка сохраняется даже без `Enter`. Никакая специальная точка, пустая строка или `Ctrl+D` также не нужны.
          '''
          s = replace_once(s, old, new, 'README input description')
          s = replace_once(s, 'mobile-01\n[Enter, если курсор остался на последней строке]\n\nВвод завершён.', 'mobile-01\n\nВвод завершён.', 'README example')
          old = 'После нормализации клиент получает имя вида `alice@vpn.orion.example`, то есть исходный почтовый домен не переносится на VPN-узел. Пустые строки и Markdown-разделители игнорируются, `\\@` понимается как обычный `@`, повторы после нормализации удаляются.'
          new = 'После нормализации клиент получает имя вида `alice@vpn.orion.example`, то есть исходный почтовый домен не переносится на VPN-узел. Пустые строки и Markdown-разделители игнорируются, `\\@` понимается как обычный `@`, повторы после нормализации удаляются. Имя обязано содержать хотя бы одну латинскую букву или цифру, поэтому строки вроде `.`, `..`, `_`, `+` или `-` отклоняются до любых изменений на сервере.'
          s = replace_once(s, old, new, 'README punctuation guard')
          p.write_text(s)

          # SPEC.md
          p = Path("SPEC.md")
          s = p.read_text()
          old = 'The operator does not upload a source list file. Input is pasted directly into the SSH terminal as one block. The first line waits normally. After input begins, complete lines are collected until no new complete line arrives for **1.5 seconds**. If the final pasted line has no trailing newline, one `Enter` commits that last line. No `.` sentinel, blank terminator line, or `Ctrl+D` is required.'
          new = 'The operator does not upload a source list file. Input is pasted directly into the SSH terminal as one block. The helper waits indefinitely for the first character; after input begins it collects the character stream until no new character arrives for **1.5 seconds**. A trailing newline is not required, so the final pasted line is preserved without pressing `Enter`. No `.` sentinel, blank terminator line, or `Ctrl+D` is required.'
          s = replace_once(s, old, new, 'SPEC input behavior')
          s = replace_once(s, '- accept only ASCII letters, digits, `.`, `_`, `+`, `-`\n- de-duplicate normalized names while preserving first-seen order', '- accept only ASCII letters, digits, `.`, `_`, `+`, `-`\n- require at least one ASCII letter or digit; punctuation-only names are rejected\n- de-duplicate normalized names while preserving first-seen order', 'SPEC normalization guard')
          p.write_text(s)

          # CHANGELOG.md
          p = Path("CHANGELOG.md")
          s = p.read_text()
          head = '# Changelog\n\n'
          entry = '''## 0.1.6-dev — 2026-09-16

          Bulk-client input hardening.

          - Reworked pasted input collection to finish on a 1.5-second character-idle gap after the paste starts, so the final line is preserved even without a trailing newline or `Enter`.
          - Single-line pastes without a trailing newline are handled by the same collector.
          - Client names made only of punctuation such as `.`, `..`, `_`, `+`, or `-` are rejected before preview/mutation; at least one ASCII letter or digit is required.
          - Extended `clients.sh --self-test` to cover both the no-final-newline path and punctuation-only rejection.
          - `install.sh` and `clients.sh` now report `0.1.6-dev`.

          '''
          if not s.startswith(head):
              raise SystemExit('CHANGELOG header mismatch')
          s = head + entry + s[len(head):]
          p.write_text(s)
          PY

      - name: Syntax and self-test
        run: |
          bash -n install.sh
          bash -n clients.sh
          bash clients.sh --self-test
          grep -Fq 'VERSION="0.1.6-dev"' install.sh
          grep -Fq 'VERSION="0.1.6-dev"' clients.sh
          grep -Fq 'collect_input' clients.sh
          grep -Fq "read -r -N 1 -t \"\$timeout\"" clients.sh
          grep -Fq "re.search(r'[a-z0-9]', s)" clients.sh

      - name: Commit changes
        run: |
          git config user.name "sliptip"
          git config user.email "70051262+sliptip@users.noreply.github.com"
          git add install.sh clients.sh README.md SPEC.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Improve bulk client input handling"
          git push
